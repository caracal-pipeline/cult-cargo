_include:
- genesis/cult-cargo-base.yml
cabs:
  ragavi:
    name: ragavi
    info: Radio Astronomy Gain and Visibility Inspector
    command: ragavi-gains
    image:
      _use: vars.cult-cargo.images
      name: ragavi
    policies:
      prefix: --
    inputs:
      table:
        info: Gain table(s) to plot. Specify space separated list for multiple
        dtype: list:File
        required: true
      ant:
        info: Plot only a specific antenna, or comma-separated list of antennas. Defaults
          to all
        dtype: str
      corr:
        info: Correlation index (ices) to plot. Defaults to all.
        dtype: str
      cmap:
        info: Matplotlib colour map to use for antennas. Defaults to coolwarm
        dtype: str
        default: coolwarm
      ddid:
        info: Spectral window to plot. Defaults to all
        dtype: str
      debug:
        info: Enabling debugging messages
        dtype: bool
      doplot:
        info: Y-axes to plot, either amplitude & phase (ap) or real and imaginary
          (ri) or (all). Defaults to ap.
        dtype: str
      field:
        info: Field ID(s) / NAME(s) to plot. Defaults to all
        dtype: list:str
      gaintype:
        info: Type of gain table(s) to be plotted. Table type is auto-detected and
          will soon be deprecated.
        dtype: list:str
      logfile:
        info: File in which to store logs. Default is ragavi.log
        dtype: str
      xaxis:
        info: Choose an x-axis for the plots, otherwise an appropriate one will be
          chosen automatically.
        dtype: str
      k-xaxis:
        info: Choose an x-axis for the plots, otherwise an appropriate one will be
          chosen automatically. Deprecated alias for xaxis.
        dtype: str
      t0:
        info: Min time to plot [in seconds]. Defaults to full range]
        dtype: float
      t1:
        info: Max time to plot [in seconds]. Defaults to full range
        dtype: float
      taql:
        info: TAQL where clause
        dtype: str
    outputs:
      htmlname:
        info: Output HTML file name (with or without .html suffix)
        dtype: str
      plotname:
        info: Static output file name (with suffix). The suffixes can be '.png' or
          '.svg' and will determine the output type.
        dtype: str
