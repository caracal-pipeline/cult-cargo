_include:
- genesis/cult-cargo-base.yml
cabs:
  casa.tclean:
    name: casa.tclean
    info: CASA tclean task. Clean based algorithm for multi-scale and wideband image
      reconstruction, widefield imaging correcting for the w-term
    command: tclean
    image:
      _use: vars.cult-cargo.images
      name: casa
    policies:
      prefix: ''
      replace:
        _: '-'
    inputs:
      msname:
        info: Name of input visibility file
        dtype: MS
        required: true
        nom_de_guerre: vis
      outlierfile:
        info: Text file with image names, sizes,centers for outliers
        dtype: File
      field:
        info: Field Name or id
        dtype: list:str
      spw:
        info: Spectral windows e.g. '0~3', '' is all
        dtype: str
      selectdata:
        info: Other data selection parameters
        dtype: bool
        default: true
      timerange:
        info: Range of time to select from data, e.g. timerange = 'YYYY/MM/DD/hh:mm:ss~YYYY/MM/DD/hh:mm:ss'
        dtype: str
      uvrange:
        info: Select data within uvrange
        dtype: str
      antenna:
        info: Select data based on antenna/baseline
        dtype: str
      scan:
        info: Scan number range
        dtype: str
      observation:
        info: Observation ID range
        dtype: str
      intent:
        info: Scan Intent(s)
        dtype: str
      datacolumn:
        info: Data column to image
        dtype: str
        default: corrected
        choices:
        - data
        - corrected
      mode:
        info: Spectral gridding type (mfs, cube, cubedata, cont)
        dtype: str
        default: mfs
        choices:
        - mfs
        - cube
        - cubedata
        - cont
        nom_de_guerre: specmode
      nchan:
        info: Number of channels (planes) in output image; -1 = all
        dtype: int
        default: -1
      start:
        info: Begin the output cube at the frequency of this channel in the MS
        dtype: str
      width:
        info: Width of output channel relative to MS channel (# to average)
        dtype: str
        default: 1
      interpolation:
        info: Spectral interpolation (nearest, linear, cubic).
        dtype: str
        default: linear
        choices:
        - nearest
        - linear
        - cubic
      resmooth:
        info: Re-restore the cube image to a common beam when True
        dtype: bool
      outframe:
        info: velocity frame of output image
        dtype: str
        choices:
        - ''
        - LSRK
        - LSRD
        - BARY
        - GEO
        - TOPO
        - GALACTO
        - LGROUP
        - CMB
      veltype:
        info: Velocity definition of output image
        dtype: str
        default: radio
        choices:
        - radio
        - optical
        - z
        - ratio
        - beta
        - gamma
      nterms:
        info: Number of Taylor coefficients to model the sky frequency dependence
        dtype: int
        default: 1
      reffreq:
        info: Reference frequency (nterms > 1),'' uses central data-frequency e.g
          '1.4GHz' with units.
        dtype: str
      gridmode:
        info: Gridding kernel for FFT-based transforms
        dtype: str
        default: standard
        choices:
        - standard
        - widefield
        - awproject
        - wproject
        - mosaic
        nom_de_guerre: gridder
      wprojplanes:
        info: Number of w-projection planes for convolution
        dtype: int
        default: 1
      projection:
        info: Coordinate prection
        dtype: str
        default: SIN
        choices:
        - SIN
        - NCP
      facets:
        info: Number of facets along each axis (main image only)
        dtype: int
        default: 1
      clean_iterations:
        info: Maximum number of iterations
        dtype: int
        default: 500
        nom_de_guerre: niter
      cycleniter:
        info: Maximum number of minor-cycle iterations (per plane) before triggering
          a major cycle
        dtype: int
        default: -1
      gain:
        info: Loop gain for cleaning
        dtype: float
        default: 0.1
      threshold:
        info: 'Flux level to stop cleaning, must include units: ''1.0mJy'''
        dtype: str
        default: 0.0mJy
      psfmode:
        info: Method of PSF calculation to use during minor cycles
        dtype: str
        default: clark
        choices:
        - clark
        - clarkstokes
        - mtmfs
        - hogbom
        - multiscale
        - mem
        nom_de_guerre: deconvolver
      cyclefactor:
        info: Controls how often major cycles are done. (e.g. 5 for frequently)
        dtype: float
        default: 1.5
      multiscale:
        info: List of deconvolution scales (pixels); [] = standard clean
        dtype: list
        nom_de_guerre: scales
      smallscalebias:
        info: a bias to give more weight toward smaller scales
        dtype: float
        default: 0.6
      interactive:
        info: Use interactive clean (with GUI viewer)
        dtype: bool
        default: false
      mask:
        info: Cleanbox(es), mask image(s),region(s), or a level
        dtype: File
      npix:
        info: 'x and y image size in pixels.  Single value: same for both'
        dtype: list
        default:
        - 1024
        - 1024
        nom_de_guerre: imsize
      cellsize:
        info: x and y cell size(s). Default unit arcsec.
        dtype: list
        default:
        - 1.0arcsec
        nom_de_guerre: cell
      phasecenter:
        info: 'Image center: direction or field index'
        dtype: str
      restfreq:
        info: Rest frequency to assign to image (see help)
        dtype: str
      stokes:
        info: Stokes params to image (eg 'I','Q','U','V','IV','QU','IQ','UV','IQUV','RR','LL','XX','YY','RRLL','XXYY')
        dtype: str
        default: I
      weight:
        info: Weighting of uv (natural, uniform,briggs, ...)
        dtype: str
        default: uniform
        choices:
        - natural
        - uniform
        - briggs
        - radial
        - superuniform
        nom_de_guerre: weighting
      robust:
        info: Briggs robustness parameter
        dtype: float
        default: 0.5
      npixels:
        info: number of pixels to determine uv-cell size 0=> field of view
        dtype: int
        default: 0
      outertaper:
        info: uv-taper on outer baselines in uv-plane
        dtype: list:str
        nom_de_guerre: uvtaper
      modelimage:
        info: Name of model image(s) to initialize cleaning
        dtype: File
        nom_de_guerre: startmodel
      restoringbeam:
        info: Output Gaussian restoring beam for CLEAN image
        dtype: list:str
      pbcor:
        info: Output primary beam-corrected image
        dtype: bool
      minpb:
        info: Minimum PB level to use (i.e. fraction that marks the max depth of cleaning)
        dtype: float
        nom_de_guerre: minpsffraction
      maxpb:
        info: Maximum PB level to use (i.e. fraction that marks the min depth of cleaning)
        dtype: float
        nom_de_guerre: maxpsffraction
      port2fits:
        info: Convert output images to FITS files
        dtype: bool
        default: true
      keep_casa_images:
        info: Keep casa images when 'port2fits' is enabled
        dtype: bool
        default: false
      parallel:
        info: Run major cycles in parallel
        dtype: bool
        default: false
      calcpsf:
        info: Calculate PSF
        dtype: bool
        default: true
      calcres:
        info: Calculate initial residual image
        dtype: bool
        default: true
      savemodel:
        info: Options to save model visibilities
        dtype: str
        choices:
        - none
        - virtual
        - modelcolumn
      restoration:
        info: Restore the model image
        dtype: bool
        default: true
      restart:
        info: Restart using existing images (and start from an existing model image)
        dtype: bool
        default: true
      autoadjust:
        info: Automatically adjust automask threshold to a higher value at the begging
        dtype: bool
      nmask:
        info: Maximum number of mask regions to be added by automasking at the beginning
          each minor cycles run
        dtype: int
      pbmask:
        info: Primary beam mask
        dtype: float
        default: 0.0
      usemask:
        info: Type of mask(s) to be used for deconvolution
        dtype: str
        default: user
      maskthreshold:
        info: Threshold for automasking (with a unit e.g. 1.0mJy or in sigma e.g 3.0
        dtype: str
      maskresolution:
        info: Resolution for automasking (e.g. 10arcsec)
        dtype: str
      pblimit:
        info: Primary beam gain level at which to cut off normalizations
        dtype: float
        default: 0.2
      rotatepastep:
        info: Parallactic angle interval to rotate nearest aperture illumination function
          (in deg)
        dtype: float
        default: 360.0
      computepastep:
        info: Parallactic angle interval to recompute aperture illumination function
          (in deg)
        dtype: float
        default: 360.0
      cfcache:
        info: Convolution function cache directory name
        dtype: str
      conjbeams:
        info: Use conjugate frequency for wideband A-terms
        dtype: bool
        default: true
      wbawp:
        info: Use frequency dependent A-term
        dtype: bool
        default: true
      psterm:
        info: Use prolate spheroidal during gridding
        dtype: bool
        default: false
      aterm:
        info: Use aperture illumination functions during gridding
        dtype: bool
        default: true
      chanchunks:
        info: Number of channel chunks to grid separately
        dtype: int
        default: 1
      vptable:
        info: VP table saved via the vpmanager
        dtype: str
      normtype:
        info: Normalization type
        dtype: str
        default: flatnoise
        choices:
        - flatnoise
        - flatsky
      noise_image:
        info: Noise image to compute sigma for stopping threshold (in case specified
          it will replace threshold)
        dtype: File
      noise_sigma:
        info: Noise sigma for stopping deconvolution in the case where noise_image
          is provided (new thresh = sigma*noise_image.std())
        dtype: float
        default: 3
    outputs:
      prefix:
        info: Pre-name of output images
        dtype: File
        nom_de_guerre: imagename
      cfcache:
        info: Convolution function cache directory
        dtype: File
