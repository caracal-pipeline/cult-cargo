_include:
- genesis/cult-cargo-base.yml
cabs:
  sofia:
    name: sofia
    info: SoFiA, the Source Finding Application, is a new HI source finding pipeline
      intended to detect and parameterise galaxies in HI data cubes. While the software
      is still under development, several stable versions of SoFiA have already been
      released. This wiki contains user documentation and technical information on
      SoFiA and its individual modules.
    command: sofia_pipeline.py
    image:
      _use: vars.cult-cargo.images
      name: sofia
    policies:
      prefix: --
    inputs:
      CNHI.maxScale:
        info: The maximum size of test regions. The default value of -1 is a flag
          value that sets the maximum size to half of the size of the spectral axis.
        dtype: int
        default: -1
      CNHI.medianTest:
        info: This parameter determines whether test regions need to have a median
          greater than that of the remaining data in order to be considered a source.
        dtype: bool
        default: true
      CNHI.minScale:
        info: The minimum size of test regions.
        dtype: int
        default: 5
      CNHI.pReq:
        info: Minimum probability requirement for detections to be considered genuine.
          Sensible values are typically in the range of about 1e−3 to 1e−5.
        dtype: float
        default: 1e-05
      CNHI.qReq:
        info: This is the Q value of the Kuiper test, which is a heuristic parameter
          for assessing the quality/accuracy of the probability calculated from the
          Kuiper test. The minimum scale that the CNHI source finder processes is
          increased until it is sufficiently large to ensure that the required Q value
          is achieved. This requirement supersedes the user-specified minimum scale
          (see parameter CNHI.minScale). The default value is 3.8, which is the generally
          accepted minimally useful value.
        dtype: float
        default: 3.8
      CNHI.verbose:
        info: An integer value that indicates the level of verbosity of the CNHI finder.
          Values of 0, 1 and 2 correspond to none, minimal and maximal, respectively.
        dtype: int
        default: 1
      SCfind.edgeMode:
        info: 'Pixel values assumed by the smoothing algorithm outside the boundaries
          of the cube. The following options are available: ''constant'' assume a
          constant value of 0; ''nearest'' assume a constant value equal to that of
          the nearest edge pixel; ''reflect'' mirror values at the edge, thereby duplicating
          the edge pixel itself; ''mirror'' mirror values at the centre of the outermost
          pixel, thereby avoiding duplication of the edge pixel itself; ''wrap'' copy
          values from the opposite edge of the cube.'
        dtype: str
        default: constant
      SCfind.kernelUnit:
        info: This parameter defines whether the kernel parameters set by SCfind.kernels
          are specified in pixel or world coordinates.
        dtype: str
        default: pixel
      SCfind.kernels:
        info: List of kernels to be used for smoothing. The format is [[dx, dy, dz,
          'type'], ...] where dx, dy, and dz are the spatial and spectral kernel sizes
          (FWHM), and 'type' can be boxcar ('b') or Gaussian ('g'). Note that 'type'
          only applies to the spectral axis, and the spatial kernel is always Gaussian.
          Kernel sizes can be given either in pixels or in world coordinates depending
          of the value of SCfind.kernelUnit.
        dtype: list
        default:
        - - 0
          - 0
          - 0
          - b
        - - 0
          - 0
          - 3
          - b
        - - 0
          - 0
          - 7
          - b
        - - 0
          - 0
          - 15
          - b
        - - 3
          - 3
          - 0
          - b
        - - 3
          - 3
          - 3
          - b
        - - 3
          - 3
          - 7
          - b
        - - 3
          - 3
          - 15
          - b
        - - 6
          - 6
          - 0
          - b
        - - 6
          - 6
          - 3
          - b
        - - 6
          - 6
          - 7
          - b
        - - 6
          - 6
          - 15
          - b
      SCfind.maskScaleXY:
        info: Set already detected pixels to sigma x maskScaleXY before spatial smoothing,
          where sigma is the rms noise level in the original data cube. Note that
          this is a hidden option not accessible through the graphical user interface.
        dtype: float
        default: 2.0
      SCfind.maskScaleZ:
        info: Not currently used.
        dtype: float
        default: 2.0
      SCfind.rmsMode:
        info: 'Statistic used to determine the noise in the data cube. The following
          options are available: standard deviation (std), median absolute deviation
          (mad), fitting of a Gaussian function to the flux histogram (gauss) or fitting
          of a Gaussian function to the negative part of the flux histogram (negative).'
        dtype: str
        default: negative
      SCfind.sizeFilter:
        info: Not currently used.
        dtype: float
        default: 0.0
      SCfind.threshold:
        info: Flux threshold relative to the noise level of the cube. The default
          value of 6.0 sigma is likely to miss a large number of faint sources in
          most cases, and lower values will be required to maximise completeness.
        dtype: float
        default: 3.5
      SCfind.verbose:
        info: If set to true, print additional progress information. Note that this
          is a hidden option not accessible through the graphical user interface.
        dtype: bool
        default: true
      flag.regions:
        info: 'Pixel/channel range(s) to be flagged prior to source finding. Format:
          [[x1, x2, y1, y2, z1, z2], ...]. A place holder, '''' (two single quotes),
          can be used for the upper range limit (x2, y2, and z2) to flag all the way
          to the end, e.g. [[0, '''', 0, '''', 0, 19]] will flag the first 20 channels
          of the entire cube. The default is an empty list, [], which means to not
          flag anything.'
        dtype: list
        default: []
      import.inFile:
        info: Full path and name of input data cube. This option is mandatory, and
          there is no default. Note that only FITS files are currently supported by
          SoFiA.
        dtype: File
      import.maskFile:
        info: Name of an optional file containing a mask of pixels identified as part
          of a source, e.g. from a previous run of SoFiA. This can be used to re-parametrise
          sources without repeating the source finding step. The default is to not
          read a mask cube.
        dtype: File
      import.subcube:
        info: This parameter defines a subcube to be read in and processed by SoFiA.
          Depending on the value of import.subcubeMode, the range is either specified
          in pixels as [x1, x2, y1, y2, z1, z2] or in world coordinates as [x, y,
          z, rx, ry, rz] depending on the value of import.subcubeMode. In the latter
          case, x, y and z define the centre of the subcube, and rx, ry and rz specify
          the half-widths in the three dimensions. If world coordinates are used,
          all parameters must be in the native format as defined in the header of
          the data cube; e.g. if CUNIT3 is 'Hz' then both z and rz must be given in
          hertz. The default is an empty list, [], which means to read the entire
          cube.
        dtype: list
        default: []
      import.subcubeMode:
        info: This parameter defines whether import.subcube is specified in pixels
          (pixel) or in world coordinates (world).
        dtype: str
        default: pixel
      import.weightsFile:
        info: Name of an optional file containing weights of pixels in the input cube.
          The weights will be applied before running the source finder. The default
          is to not apply weights.
        dtype: File
      import.weightsFunction:
        info: 'Analytic function used to describe the data weights as a function of
          x, y, and z. The default is to not apply weights. The following mathematical
          functions from Numpy are supported: sin(), cos(), tan(), arcsin(), arccos(),
          arctan(), arctan2(), sinh(), cosh(), tanh(), arcsinh(), arccosh(), arctanh(),
          exp(), log(), log10(), log2(), sqrt(), square(), power(), absolute(), fabs(),
          and sign(). Note that the weights function is not applied whenever a weights
          cube is specified (see import.weightsFile).'
        dtype: str
      merge.minSizeX:
        info: Minimum required extent in first dimension of genuine sources after
          merging. Sources below this size will be discarded.
        dtype: int
        default: 3
      merge.minSizeY:
        info: Minimum required extent in second dimension of genuine sources after
          merging. Sources below this size will be discarded.
        dtype: int
        default: 3
      merge.minSizeZ:
        info: Minimum required extent in third dimension of genuine sources after
          merging. Sources below this size will be discarded.
        dtype: int
        default: 2
      merge.radiusX:
        info: Merging radius in first dimension in pixels. Note that a value of 0
          means that no merging takes place and each detected pixel is retained as
          a separate source.
        dtype: int
        default: 2
      merge.radiusY:
        info: Merging radius in second dimension in pixels. Note that a value of 0
          means that no merging takes place and each detected pixel is retained as
          a separate source.
        dtype: int
        default: 2
      merge.radiusZ:
        info: Merging radius in third dimension in pixels. Note that a value of 0
          means that no merging takes place and each detected pixel is retained as
          a separate source.
        dtype: int
        default: 3
      optical.sourceCatalogue:
        info: This parameter defines the full path to the input catalogue required
          for catalogue-based source finding (see parameter steps.doOptical). There
          is no default. Catalogues must be comma-separated and contain at least four
          columns containing a unique ID number, right ascension, declination and
          frequency/velocity of the positions to be searched. All parameters must
          be specified in the native WCS units of the cube. In addition, a header
          line must be provided, with the four parameter columns above listed as id,
          ra, dec and z.
        dtype: File
      optical.spatSize:
        info: This parameter defines the spatial size of the sub-cube to be searched
          around each catalogue position. The size must be specified in the native
          units of the data cube, e.g. in degrees.
        dtype: float
        default: 0.01
      optical.specSize:
        info: This parameter defines the spectral size of the sub-cube to be searched
          around each catalogue position. The size must be specified in the native
          units of the data cube, e.g. in km/s or Hz.
        dtype: float
        default: 100000.0
      optical.storeMultiCat:
        info: If set to true, a separate output catalogue will be created for each
          input position, containing only the sources found in that subcube. In addition,
          a single, merged catalogue will also be created. By default this parameter
          is set to false, in which case only a single output catalogue file is generated.
        dtype: bool
        default: false
      parameters.dilateChanMax:
        info: Sets the maximum mask dilation along the spectral axis. Note that this
          is a hidden option not accessible through the graphical user interface.
        dtype: int
        default: 1
      parameters.dilateMask:
        info: Run the mask optimisation algorithm based on spatially dilating the
          initial mask to achieve more accurate flux measurements. The advantage of
          this algorithm is that it preserves the source shape (also see parameters.optimiseMask).
        dtype: bool
        default: true
      parameters.dilatePixMax:
        info: Sets the maximum mask dilation (in pixels) in the spatial domain. Note
          that this is a hidden option not accessible through the graphical user interface.
        dtype: int
        default: 10
      parameters.dilateThreshold:
        info: Defines convergence of the mask dilation. Dilation  stops when the relative
          flux growth is below 1+ this threshold. Note that this is a hidden option
          not accessible through the graphical user interface.
        dtype: float
        default: 0.02
      parameters.fitBusyFunction:
        info: Fit the Busy Function (Westmeier et al. 2014) to the integrated spectrum
          of each source for more accurate parameterisation.
        dtype: bool
        default: true
      parameters.optimiseMask:
        info: Run the mask optimisation algorithm based on fitting and growing ellipses
          to achieve more accurate flux measurements. Note that the improved integrated
          fluxes obtained by this algorithm will come at the cost of increased statistical
          uncertainties in most source parameters (also see parameters.dilateMask).
        dtype: bool
        default: false
      reliability.autoKernel:
        info: This parameter controls whether the kernel size to be used for reliability
          calculation should be determined automatically (true) or manually (false).
          Default is true. If set to false, the reliability.kernel parameter must
          be used to specify the kernel size. Note that this is a hidden option not
          accessible through the graphical user interface. Also see the reliability.negPerBin
          and reliability.skellamTol parameters.
        dtype: bool
        default: true
      reliability.fMin:
        info: Minimum value of the sum of the pixel values, Sum(Si), divided by the
          global RMS noise level, sigma, and the square root of the number of pixels,
          N, for a source to be considered reliable. This parameter is a proxy for
          integrated signal-to-noise ratio, SNRint = Sum(Si) / [sigmaxsqrt(N)xsqrt(Omega)],
          where Omega is the solid angle of the beam, but has not yet been divided
          by the square root of the beam solid angle in pixels.
        dtype: float
        default: 0.0
      reliability.kernel:
        info: Size of the 3D smoothing kernel in log(parameter) space (see reliability.parSpace).
          This parameter will be ignored if reliability.autoKernel is set to true
          (default behaviour). Note that this is a hidden option not accessible through
          the graphical user interface.
        dtype: list
        default:
        - 0.15
        - 0.05
        - 0.1
      reliability.logPars:
        info: For each source parameter defined in reliability.parSpace this parameter
          defines whether the reliability analysis is carried out in linear space
          (0) or in logarithmic space (1). Note that this is a hidden option not accessible
          through the graphical user interface.
        dtype: list
        default:
        - 1
        - 1
        - 1
      reliability.makePlot:
        info: If set to true, PDF files showing the distribution of positive and negative
          detections in parameter space will be created for diagnostic purposes.
        dtype: bool
        default: false
      reliability.negPerBin:
        info: This parameter defines the minimum number of negative detections per
          bin in parameter space required for the automatic kernel size determination.
          Note that this is a hidden option not accessible through the graphical user
          interface.
        dtype: float
        default: 1.0
      reliability.parSpace:
        info: Defines the 3D parameter space in which to determine reliability. It
          is strongly recommended to use the pre-defined default settings. Note that
          this is a hidden option not accessible through the graphical user interface.
        dtype: list
        default:
        - n_pix
        - snr_sum
        - snr_max
      reliability.scaleKernel:
        info: If autoKernel is set to true, then this parameter will determine whether
          the kernel size will be set automatically by SoFiA (0) or scaled by the
          given factor (> 0). If autoKernel is false, this option will be ignored.
        dtype: float
        default: 0.55
      reliability.skellamTol:
        info: Tolerance parameter for reliability kernel size determination. Note
          that this is a hidden option not accessible through the graphical user interface.
        dtype: float
        default: -0.5
      reliability.threshold:
        info: Discard all sources whose reliability is below this threshold.
        dtype: float
        default: 0.95
      reliability.usecov:
        info: Controls whether to use the full covariance kernel when smoothing the
          distribution of detections in parameter space. The default is true. Note
          that this is a hidden option not accessible through the graphical user interface.
        dtype: bool
        default: true
      scaleNoise.edgeX:
        info: Size of the edge (in pixels) to be excluded in first (spatial) dimension.
          The setting will be ignored if scaleNoise.method = local.
        dtype: int
      scaleNoise.edgeY:
        info: Size of the edge (in pixels) to be excluded in second (spatial) dimension.
          The setting will be ignored if scaleNoise.method = local.
        dtype: int
      scaleNoise.edgeZ:
        info: Size of the edge (in pixels) to be excluded in third (spectral) dimension.
          The setting will be ignored if scaleNoise.method = local.
        dtype: int
      scaleNoise.scaleX:
        info: If set to true, apply noise normalisation in first (spatial) dimension.
          The setting will be ignored if scaleNoise.method = local.
        dtype: bool
      scaleNoise.scaleY:
        info: If set to true, apply noise normalisation in second (spatial) dimension.
          The setting will be ignored if scaleNoise.method = local.
        dtype: bool
      scaleNoise.scaleZ:
        info: If set to true, apply noise normalisation in third (spectral) dimension.
          The setting will be ignored if scaleNoise.method = local.
        dtype: bool
      scaleNoise.statistic:
        info: 'Statistic used to determine the noise in the data cube. The following
          options are available: standard deviation (std), median absolute deviation
          (mad), fitting of a Gaussian to the flux histogram (gauss) or fitting of
          a Gaussian function to the negative part of the flux histogram (negative).'
        dtype: str
        default: negative
      smooth.edgeMode:
        info: 'Pixel values assumed by the smoothing algorithm outside the boundaries
          of the cube. The following options are available: ''constant'' assume a
          constant value of 0; ''nearest'' assume a constant value equal to that of
          the nearest edge pixel; ''reflect'' mirror values at the edge, thereby duplicating
          the edge pixel itself; ''mirror'' mirror values at the centre of the outermost
          pixel, thereby avoiding duplication of the edge pixel itself; ''wrap'' copy
          values from the opposite edge of the cube.'
        dtype: str
        default: constant
      smooth.kernel:
        info: Type of smoothing kernel used in both spatial and spectral smoothing.
          The possible options are gaussian, boxcar or median.
        dtype: str
        default: gaussian
      smooth.kernelX:
        info: Kernel size in pixels for the first (spatial) coordinate. For Gaussian
          kernels the value refers to the FWHM.
        dtype: float
        default: 3.0
      smooth.kernelY:
        info: Kernel size in pixels for the second (spatial) coordinate. For Gaussian
          kernels the value refers to the FWHM.
        dtype: float
        default: 3.0
      smooth.kernelZ:
        info: Kernel size in pixels for the third (spectral) coordinate. For Gaussian
          kernels the value refers to the FWHM.
        dtype: float
        default: 3.0
      steps.doCNHI:
        info: If set to true, run the Characterised Noise HI (CNHI) source finder
          by Jurek (2012).
        dtype: bool
        default: false
      steps.doCubelets:
        info: If set to true, a range of data products for each individual source
          will be created and written to disk, including a small sub-cube, moment-0,
          1 and 2 maps, a position–velocity diagram along the kinematical major axis
          and an integrated spectrum of the source.
        dtype: bool
        default: false
      steps.doDebug:
        info: Creates additional debugging data products.
        dtype: bool
        default: false
      steps.doFlag:
        info: Flag pixel and channel ranges before proceeding. Details are specified
          with the flag.file and flag.regions options.
        dtype: bool
        default: false
      steps.doMerge:
        info: If set to true, pixels detected by the source finder will be merged
          into final sources based on user-defined separation and size criteria.
        dtype: bool
        default: false
      steps.doMom0:
        info: If set to true, a moment-0 map of all detected sources will be created
          and saved to disk.
        dtype: bool
        default: false
      steps.doMom1:
        info: If set to true, a moment-1 map of all detected sources will be created
          and saved to disk.
        dtype: bool
        default: false
      steps.doOptical:
        info: If set to true, run SoFiA on multiple, smaller sub-cubes centred on
          positions defined in an input source catalogue. A catalogue file will need
          to be specified (see parameter optical.sourceCatalogue). This could, e.g.,
          be an optical galaxy catalogue with the aim to search for HI detections
          at the positions of all galaxies. Note that optical_find.py must be called
          in this case when running SoFiA from the command line interface!
        dtype: bool
        default: false
      steps.doParameterise:
        info: If set to true, run the mask optimisation and source parameterisation
          module.
        dtype: bool
        default: false
      steps.doReliability:
        info: If set to true, use negative detections to determine the reliability
          of each source based on the algorithm of Serra, Jurek & Flöer (2012).
        dtype: bool
        default: false
      steps.doSCfind:
        info: If set to true, run the smooth + clip finder.
        dtype: bool
        default: true
      steps.doScaleNoise:
        info: If set to true, normalise noise levels across the data cube prior to
          source finding.
        dtype: bool
        default: true
      steps.doSmooth:
        info: If set to true, spatially and spectrally smooth the data cube prior
          to source finding.
        dtype: bool
        default: false
      steps.doSubcube:
        info: If set to true, source finding can be carried out on a subcube to be
          defined by the import.subcube and import.subcubeMode options.
        dtype: bool
        default: false
      steps.doThreshold:
        info: If set to true, run the threshold finder.
        dtype: bool
        default: false
      steps.doWavelet:
        info: If set to true, decompose the data cube into wavelet components using
          the 2D–1D wavelet decomposition algorithm of Flöer & Winkel (2012).
        dtype: bool
        default: false
      steps.doWriteCat:
        info: If set to true, write output catalogue(s) to disk. Note that this is
          a hidden option not accessible through the graphical user interface.
        dtype: bool
        default: false
      steps.doWriteFilteredCube:
        info: If set to true, save a copy of the filtered data cube. Note that this
          will only make sense if at least one of the input filters was applied.
        dtype: bool
        default: false
      steps.doWriteMask:
        info: If set to true, save the mask cube.
        dtype: bool
        default: true
      threshold.clipMethod:
        info: Is the threshold specified by threshold.threshold relative to the noise
          level or in absolute flux units?
        dtype: str
        default: relative
      threshold.rmsMode:
        info: 'Statistic used to determine the noise in the data cube. The following
          options are available: standard deviation (std), median absolute deviation
          (mad), fitting of a Gaussian function to the flux histogram (gauss) or fitting
          of a Gaussian function to the negative part of the flux histogram (negative).'
        dtype: str
        default: std
      threshold.threshold:
        info: Absolute or relative flux threshold (see threshold.clipMethod). The
          default value of 4.0 sigma is likely to miss a large number of faint sources
          in most cases, and lower values will be required to maximise completeness.
        dtype: float
        default: 4.0
      threshold.verbose:
        info: If set to true, print additional progress information. Note that this
          is a hidden option not accessible through the graphical user interface.
        dtype: bool
        default: false
      wavelet.iterations:
        info: Number of iterations to be used in the wavelet reconstruction process.
        dtype: int
        default: 3
      wavelet.positivity:
        info: If set to true, include only positive wavelet components in the decomposition.
          Otherwise, negative components will be included as well.
        dtype: bool
        default: false
      wavelet.scaleXY:
        info: null
        dtype: int
        default: -1
      wavelet.scaleZ:
        info: Number of spectral scales used in the decomposition. The default value
          of -1 will automatically determine the appropriate number of scales based
          on the actual data cube.
        dtype: int
        default: -1
      wavelet.threshold:
        info: Flux threshold used in the wavelet reconstruction processs in multiples
          of the rms noise. Note that this threshold only determines which wavelet
          components are added to the decomposed cube. Any source finder run after
          the reconstruction will use its own flux threshold.
        dtype: float
        default: 5.0
      writeCat.basename:
        info: Optional base name of all output files. If not specified, the input
          file name will be used by default.
        dtype: str
      writeCat.compress:
        info: If set to true, use gzip to compress all output files.
        dtype: bool
        default: false
      writeCat.overwrite:
        info: If set to true, any existing output files will automatically get overwritten.
          If set to false, the pipeline will print an error message for any output
          file that already exists and skip writing that file.
        dtype: bool
        default: true
      writeCat.parameters:
        info: 'List of parameters to appear in source catalogue. Format: [''par1'',
          ''par2'', ...]. An asterisk, [''*''], means that all available parameters
          are written to the output catalogue. Note that, depending on the actual
          pipeline settings, some selected parameters may not appear in the source
          catalogue.'
        dtype: list
        default:
        - '*'
      writeCat.writeASCII:
        info: If set to true, write catalogue in human-readable ASCII format.
        dtype: bool
        default: true
      writeCat.writeSQL:
        info: If set to true, write catalogue in SQL format for insertion into an
          SQL database.
        dtype: bool
        default: false
      writeCat.writeXML:
        info: If set to true, write catalogue in VO table format (XML).
        dtype: bool
        default: true
      pipeline.pedantic:
        info: If set to true (default), SoFiA will exit with an error message whenever
          unrecognised or multiply-defined parameters are encountered in the parameter
          file. If set to false, SoFiA will ignore all unknown and redefined parameter
          settings and print a warning message for each case. This is a hidden option
          not available in the GUI.
        dtype: bool
      steps.doWriteNoiseCube:
        info: If set to true, then a copy of the noise cube estimated by SoFiA will
          be written to disk as a FITS file. This will only work if noise scaling
          is enabled (steps.doScaleNoise = true).
        dtype: bool
      flag.file:
        info: Full path and file name of an optional flagging cube that must be of
          the same dimensions as the input cube. All pixels that are flagged (i.e.
          set to BLANK) in the flagging cube will also be flagged in the input cube
          prior to source finding. The default is to not apply flags.
        dtype: File
      scaleNoise.method:
        info: If set to global, the noise measurement will be carried out on the entire
          projected image plane perpendicular to the axis along which the noise is
          to be scaled (default). If set to local, the noise measurement will occur
          in a running window of specified size on a specified grid. Note that the
          latter can be slow and memory-heavy and is only recommended for small cubes
          or 2D images that are affected by localised noise variations. If set to
          1d2d normalise the noise first channel by channel along Z, and then in XY
          windows.
        dtype: str
        choices:
        - global
        - local
        - 1d2d
      scaleNoise.fluxRange:
        info: Range of flux values to be used in noise measurement. Can be negative,
          positive or all to use only negative, only positive or all pixels, respectively.
        dtype: str
        choices:
        - negative
        - positive
        - all
      scaleNoise.windowSpatial:
        info: This defines the spatial window size over which the local noise measurement
          is taken. The setting will only be relevant if scaleNoise.method = local.
          It must be an odd number of 1 or greater.
        dtype: int
      scaleNoise.windowSpectral:
        info: This defines the spectral window size over which the local noise measurement
          is taken. The setting will only be relevant if scaleNoise.method = local.
          It must be an odd number of 1 or greater.
        dtype: int
      scaleNoise.gridSpatial:
        info: This defines the separation of spatial grid points on which the local
          noise measurement takes place. The setting will only be relevant if scaleNoise.method
          = local. It must be an odd number of 1 or greater. Alternatively, if set
          to 0 (default), SoFiA will automatically determine an appropriate grid size
          based on the specified window size. This is a hidden option not available
          in the GUI.
        dtype: int
      scaleNoise.interpolation:
        info: Select if the local noise measurement made by SoFiA should be interpolated
          in between grid points or not. The default is none which will simply fill
          each grid cell with the noise value. linear will carry out a linear interpolation
          between grid points, which is slower, but results in smoother noise maps.
          Lastly, cubic will carry out a cubic spline interpolation between grid points,
          which is by far the slowest method, but results in the smoothest noise maps.
          Note that this setting will only be relevant if scaleNoise.method = local.
        dtype: str
        choices:
        - none
        - linear
        - cubic
      SCfind.fluxRange:
        info: Range of flux values to be used in noise measurement. Can be negative,
          positive or all to use only negative, only positive or all pixels, respectively.
        dtype: str
        default: all
        choices:
        - positive
        - negative
        - all
      threshold.fluxRange:
        info: Range of flux values to be used in noise measurement. Can be negative,
          positive or all to use only negative, only positive or all pixels, respectively.
        dtype: str
        default: all
        choices:
        - positive
        - negative
        - all
      port2tigger:
        info: null
        dtype: bool
      pipeline.trackMemory:
        info: If set to true, SoFiA will report its own peak memory usage at certain
          times throughout the pipeline run. This is a hidden option not available
          in the GUI.
        dtype: bool
      steps.doFilterArtefacts:
        info: If set to true, SoFiA will attempt to automatically flag residual continuum
          emission in the data on a position-by-position basis by measuring the noise
          along the line of sight and blanking all positions where the noise is above
          a given threshold with respect to the global noise level of the data cube.
        dtype: bool
      import.invertData:
        info: If set to true, SoFiA will multiply the data cube by −1 in order to
          search for negative signals.
        dtype: bool
      import.sources:
        info: List of source IDs to be retained in the input source mask (e.g. [1,
          3, 4]). An empty list ([]) means that all sources are kept (default). Otherwise,
          sources not in the list will be removed from the mask before proceeding.
          This parameter will only take effect if import.maskFile is set.
        dtype: list:str
      scaleNoise.gridSpectral:
        info: This defines the separation of spectral grid points on which the local
          noise measurement takes place. The setting will only be relevant if scaleNoise.method
          = local. It must be an odd number of 1 or greater. Alternatively, if set
          to 0 (default), SoFiA will automatically determine an appropriate grid size
          based on the specified window size. This is a hidden option not available
          in the GUI.
        dtype: int
        default: 0
      filterArtefacts.threshold:
        info: Threshold for masking lines of sight with anomalously high noise. A
          line of sight is masked if its noise level is more than filterArtefacts.threshold
          * STD above the global noise level of the data cube, where STD is the standard
          deviation of the distribution of the noise values across all lines of sight.
        dtype: float
        default: 4.0
      filterArtefacts.dilation:
        info: Size of the box structuring element used to propagate the flagging to
          neighbouring lines of sight. A value of 1 means no dilation.
        dtype: int
        default: 3
      merge.maxSizeX:
        info: Maximum allowed extent of genuine sources in first dimension after merging.
          Sources above this size will be discarded. Set to -1 to disable maximum
          size filtering.
        dtype: int
        default: -1
      merge.maxSizeY:
        info: Maximum allowed extent of genuine sources in second dimension after
          merging. Sources above this size will be discarded. Set to -1 to disable
          maximum size filtering.
        dtype: int
        default: -1
      merge.maxSizeZ:
        info: Maximum allowed extent of genuine sources in third dimension after merging.
          Sources above this size will be discarded. Set to -1 to disable maximum
          size filtering.
        dtype: int
        default: -1
      merge.minVoxels:
        info: Minimum required number of voxels of genuine sources after merging.
          Sources below this limit will be discarded. Note that this is a hidden option
          not available in the GUI.
        dtype: int
        default: 1
      merge.maxVoxels:
        info: Maximum allowed number of voxels of genuine sources after merging. Sources
          above this limit will be discarded. Set to -1 to disable maximum size filtering.
          Note that this is a hidden option not available in the GUI.
        dtype: int
        default: -1
      merge.minLoS:
        info: Minimum required number of lines-of-sight (i.e. spatial pixels) of genuine
          sources after merging. Sources below this limit will be discarded. Note
          that this is a hidden option not available in the GUI.
        dtype: int
        default: 1
      merge.maxLoS:
        info: Maximum allowed number of lines-of-sight (i.e. spatial pixels) of genuine
          sources after merging. Sources above this limit will be discarded. Set to
          -1 to disable maximum size filtering. Note that this is a hidden option
          not available in the GUI.
        dtype: int
        default: -1
      merge.minFill:
        info: null
        dtype: int
        default: -1
      merge.maxFill:
        info: null
        dtype: int
        default: 2
      merge.minIntens:
        info: Probably some minimum flux limit. Note that this is a hidden option
          not available in the GUI.
        dtype: float
        default: -9e30
      merge.maxIntens:
        info: Probably some maximum flux limit. Note that this is a hidden option
          not available in the GUI.
        dtype: float
        default: 9e30
      merge.positivity:
        info: 'If set to true, only positive signals will be merged into detections,
          and all negative signals will be discarded. This is useful for data sets
          with significant negative artefacts, such as sidelobes. The default is false.
          Warning: Enabling positivity is dangerous and will render some of SoFiA’s
          most powerful algorithms useless, including mask optimisation and reliability
          calculation. Only use this feature if you are fully aware of its risks and
          consequences!'
        dtype: bool
      parameters.getUncertainties:
        info: If set to true, statistical uncertainties of several source parameters,
          including centroids and line widths, will be estimated. Please use this
          feature with great caution, as statistical uncertainties are not likely
          to be representative of the true uncertainties, in particular when systematic
          errors are present. Note that this is a hidden option not accessible through
          the graphical user interface.
        dtype: bool
      scaleNoise.perSCkernel:
        info: if True normalise noise variations within the cube after each smoothing
          operation within the S+C source finder and befpre applying the detection
          threshold.
        dtype: bool
        default: false
