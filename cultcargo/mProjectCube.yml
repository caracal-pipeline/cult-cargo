_include:
- genesis/cult-cargo-base.yml
cabs:
  mProjectCube:
    name: mProjectCube
    info: 'mProjectCube reprojects a single cube to the scale defined in a FITS header
      template file (read more about header templates here). The program produces
      a pair of files: the reprojected cube and an ''area'' image consisting of the
      fraction input pixel sky area that went into each output pixel. The ''drizzle''
      algorithm is implemented. The algorithm proceeds by mapping pixel corners (as
      adjusted by drizzle, if called) from the input pixel space to the output pixel
      space, calculating overlap area with each output pixel, and accumulating an
      appropriate fraction of the input flux into the output cube pixels. In addition,
      the appropriate fraction of the input pixel area is accumulated into the area
      image pixels. Projection of points from input pixel space to output pixel space
      is calculated in two steps: first map from input pixel space to sky coordinates;
      second map from sky coordinates to output pixel space.'
    command: mProjectCube
    image:
      _use: vars.cult-cargo.images
      name: montage
    policies:
      prefix: '-'
    inputs:
      in.fits:
        info: Input FITS file to be reprojected
        dtype: File
      hdr.template:
        info: FITS header template to be used in generation of output image
        dtype: File
      factor:
        info: Processing is done utilizing the drizzle algorithm. factor is a floating
          point number; recommended drizzle factors are from 0.5 to 1.
        dtype: float
      level:
        info: Causes additional debugging information to be printed to stdout. Valid
          levels are 1-5 (for higher debugging levels, it is recommended to redirect
          the output to a file).
        dtype: int
      hdu:
        info: Use the specified FITS extension (default is to use the first HDU with
          image data)
        dtype: str
      scale:
        info: Apply a correction factor of scale to each pixel.
        dtype: bool
      weight:
        info: Path to a weight map to be used when reading values from the input image.
        dtype: File
      fixed-weight:
        info: Use constant weight value for the whole image
        dtype: bool
      threshold:
        info: Pixels with weights below threshold will be treated as blank.
        dtype: float
      X:
        info: Makes the output region (originally defined in the header template)
          big enough to include all of the input images.
        dtype: bool
      e:
        info: Process the data as total energy rather than the default energy density
          (scale values by relative pixel areas).
        dtype: bool
      f:
        info: Output the full region requested even if there is a border of NULL values
          (default is to shrinkwrap to just the pixels with values).
        dtype: bool
    outputs:
      out.fits:
        info: Path of output FITS file to be created.
        dtype: File
