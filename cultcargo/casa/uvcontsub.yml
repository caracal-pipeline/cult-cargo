_include:
- (cultcargo):
  - genesis/cult-cargo-base.yml
cabs:
  casa.uvcontsub:
    name: casa.uvcontsub
    info: Continuum fitting and subtraction in the uv plane. This task estimates the
      continuum emission by fitting polynomials to the real and imaginary parts of
      the spectral windows and channels selected by fitspw.  This fit represents a
      model of the continuum in  all channels. The fitted continuum spectrum is subtracted
      from all channels selected in spw, and the result (presumably only line emission)  is
      stored in a new MS (vis + '.contsub'). If an MS with the output name already
      exists, it will be overwritten. It will read from the CORRECTED_DATA column
      of vis if it is present, or DATA if it is not.  Whichever column is read is
      presumed to have already been calibrated. If want_cont is True, the continuum
      fit is placed in a second new MS (vis + '.cont', also overwritten if it already
      exists).  N.B. because the continuum model is necessarily a smoothed fit, images
      made with it are liable to have their field of view reduced in some strange
      way.  Images of the continuum should be made by simply excluding the line channels
      (and probably averaging the remaining ones) in clean.
    command: uvcontsub
    image:
      _use: vars.cult-cargo.images
      name: casa
    policies:
      prefix: ''
      replace:
        _: '-'
    inputs:
      msname:
        info: Name of input MS.  Output goes to vis + '.contsub' (will be overwritten
          if already exists)
        dtype: MS
        required: true
        nom_de_guerre: vis
      field:
        info: Select field(s) using id(s) or name(s)
        dtype: str
      fitspw:
        info: Spectral window:channel selection for fitting the continuum
        dtype: str
      excludechans:
        info: Exclude Spectral window:channel selection in fitspw for fitting
        dtype: str
      combine:
        info: Data axes to combine for the continuum estimation (none, or spw and/or
          scan)
        dtype: str
        choices:
        - null
        - spw
        - scan
      solint:
        info: Continuum fit timescale (int recommended!)
        dtype: str
        default: int
      fitorder:
        info: Polynomial order for the fits
        dtype: int
        default: 0
      spw:
        info: Spectral window selection for output
        dtype: str
      want_cont:
        info: Create vis + '.cont' to hold the continuum estimate.
        dtype: bool
        default: false
